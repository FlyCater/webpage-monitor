name: Page availability check

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-page-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch monitored code and protected state
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check pages and privately notify
        env:
          CONVENTIONS: ${{ secrets.CONVENTIONS }}
          STATE_HMAC_KEY: ${{ secrets.STATE_HMAC_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/monitor.py

      - name: Save anonymous duplicate-alert fingerprints
        shell: bash
        run: |
          if git diff --quiet -- .state/notified.txt; then
            echo 'No state update needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .state/notified.txt
          git commit -m 'Update notification state'
          git push origin HEAD:${{ github.event.repository.default_branch }}
